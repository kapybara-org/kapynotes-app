# Screenshots of the phone integration tests, for a reviewer to look at. Add
# the `phones` label to a pull request, or run
# `gh workflow run phones.yml --ref <branch>`. A label run uses the pull
# request's merge commit, which has main's copy of this file. A dispatch runs
# the branch's own copy, so a branch cut before this file landed merges main
# first.
#
# Two jobs run the phone integration tests that tool/ci/phone_screenshots.sh
# lists under flutter drive and upload every screenshot they take: android on
# an Android 16 emulator, as the android-screenshots artifact, and ios on an
# iOS 27.2 iPhone simulator, as ios-screenshots. Each fails when a test fails,
# and the screenshots up to that point still upload.
# The ios job holds one of the five macOS jobs the organization can run at
# once, so nothing here runs on a push.
#
# A dispatch with release_check=true runs only android-release, which checks
# the release build's on-demand live translation on an emulator (KAP-431).
name: Phones
# A dispatch that names its tests says so in its title, so a run of some
# tests is never taken for the run of them all at the same head.
run-name: "${{ inputs.release_check && 'Phones (release check)' || inputs.tests && format('Phones (tests: {0})', inputs.tests) || github.event.pull_request.title || 'Phones' }}"

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tests:
        description: The only tests to run, such as phone_recording_away; empty runs them all. A run of some tests names them in its title, fails on a name that isn't one of the phone tests, and runs beside a run of them all on the same branch instead of cancelling it
        required: false
        default: ''
      release_check:
        description: Run only the release build check of live translation on Android, instead of the phone tests
        type: boolean
        default: false

permissions:
  contents: read

# Adding any label starts this workflow, so the group names the label: a run
# for another label, which skips its jobs, never cancels a phones run. It
# names a dispatch's tests too, so a run of some never cancels one of them all.
concurrency:
  group: phones-${{ github.ref }}-${{ github.event.label.name }}-${{ inputs.tests }}${{ inputs.release_check && '-release' || '' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'
  PHONE_TESTS: ${{ inputs.tests }}

jobs:
  # Checks the names in `tests` before either phone job takes a runner, so a
  # typo fails in seconds rather than after a macOS job's setup. Skipped on a
  # release check, which skips android and ios with it.
  names:
    if: (github.event_name == 'workflow_dispatch' && !inputs.release_check) || github.event.label.name == 'phones'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tool/ci/phone_screenshots.sh --check

  android:
    needs: names
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'phones'
    runs-on: ubuntu-latest
    # A green run takes 38 to 45 minutes, so 60 leaves room for a slow cold
    # build and one rerun of a file the emulator spoiled.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The emulator needs hardware acceleration, and the runner's /dev/kvm
      # belongs to root until this rule opens it.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: ./.github/actions/flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get --enforce-lockfile

      - name: Screenshots on an Android 16 emulator
        # A file that hangs gives up 15 or 12 of the job's 60 minutes. A file
        # the emulator spoils before its tests finish runs once more within
        # the first 40.
        env:
          PHONE_FIRST_FILE_MINUTES: 15
          PHONE_FILE_MINUTES: 12
          PHONE_RETRY_MINUTES: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tool/ci/phone_screenshots.sh emulator-5554

      - name: List the screenshots
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          shots=(build/screenshots/*.png)
          {
            echo "### ${#shots[@]} Android screenshots"
            for shot in "${shots[@]}"; do echo "- $(basename "$shot" .png)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: build/screenshots/
          if-no-files-found: error

  # The release app bundle on an Android 16 emulator, the way Play would put
  # it there, through bundletool's local testing, for live translation's
  # on-demand translation_runtime module and the R8 rules it relies on, which
  # a debug build never exercises. Signed with a key made here and thrown
  # away with the runner, never the upload key. tool/ci/android_release_check.sh
  # says what it checks.
  android-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: ./.github/actions/flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get --enforce-lockfile

      - name: Make a throwaway signing key
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keystore="$RUNNER_TEMP/throwaway.jks"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore" \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Kapy Notes release check" -storepass "$password" -keypass "$password"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=throwaway\nkeyPassword=%s\n' \
            "$keystore" "$password" "$password" > android/key.properties
          { echo "KEYSTORE=$keystore"; echo "KEY_PASSWORD=$password"; } >> "$GITHUB_ENV"

      # The flags packaging/release.sh builds the store bundle with, once with
      # the app's entrypoint and once with the probe's.
      - name: Build the release bundle and the probe's
        run: |
          set -euo pipefail
          mkdir -p build/release-check
          flags=(--release --obfuscate --split-debug-info=build/release-check/symbols --dart-define=KAPYNOTES_KAPY_AI=true)
          flutter build appbundle "${flags[@]}"
          cp build/app/outputs/bundle/release/app-release.aab build/release-check/app.aab
          flutter build appbundle "${flags[@]}" -t tool/live_release_probe.dart
          cp build/app/outputs/bundle/release/app-release.aab build/release-check/probe.aab

      - name: Make local-testing APKs with bundletool
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL --retry 5 -o "$bundletool" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum -c -
          echo "BUNDLETOOL=$bundletool" >> "$GITHUB_ENV"
          for name in app probe; do
            java -jar "$bundletool" build-apks --local-testing \
              --bundle "build/release-check/$name.aab" --output "build/release-check/$name.apks" \
              --ks "$KEYSTORE" --ks-key-alias throwaway \
              --ks-pass "pass:$KEY_PASSWORD" --key-pass "pass:$KEY_PASSWORD"
          done

      # With audio, unlike the android job, so the live session has a
      # microphone to open.
      - name: Check the release build on an Android 16 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash tool/ci/android_release_check.sh emulator-5554 build/release-check

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-check
          path: build/release-check/evidence/
          if-no-files-found: warn

      - if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/throwaway.jks"

  ios:
    needs: names
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'phones'
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      # The runner defaults to Xcode 27.1; 27.2 brings the iOS 27.2 runtime.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pub cache's key: the digest hashFiles('pubspec.lock') gives, taken
      # before the iPhone starts booting. hashFiles has a hard 120 s limit, and
      # it ran past that while the iPhone was booting in the background.
      - name: Hash the lockfile
        id: lock
        shell: bash
        run: |
          hash=$(openssl dgst -sha256 -binary pubspec.lock | shasum -a 256 | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # A fresh iPhone, booting in the background while Flutter installs. The
      # software keyboard has to come up as it does on a phone, so no hardware
      # keyboard is connected.
      - name: Create an iOS 27.2 iPhone
        id: simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          udid=$(xcrun simctl create phones "iPhone 17" com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl boot "$udid" >/dev/null 2>&1 &
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          lock-hash: ${{ steps.lock.outputs.hash }}

      - run: flutter pub get --enforce-lockfile

      # flutter_gemma's build hook fetches its native libraries from GitHub
      # once, with no retry; this fetches them first, with retries (KAP-320).
      - run: bash tool/ci/gemma_natives.sh ios_sim_arm64

      # Waits out the boot, or boots the iPhone if that failed, then turns
      # Slide to Type off, which only a booted iPhone accepts, so its
      # introduction doesn't cover the first keyboard.
      - name: Wait for the iPhone
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.ContinuousPath KeyboardContinuousPathEnabled -bool false

      # AXe presses the iPhone's Lock and Home buttons for
      # phone_recording_away: from Xcode 27 a simulator takes button presses
      # only through its own HID service, which simctl has no command for. It
      # also reads the iPhone's screen, Dynamic Island included, which
      # simctl's screenshot leaves out. A first read of the iPhone's
      # accessibility loads the Xcode frameworks its touches need, which on a
      # cold runner take longer than a touch allows.
      - name: Install AXe
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/axe.tar.gz" https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz
          echo "8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version
          for _ in 1 2 3; do
            "$RUNNER_TEMP/axe/axe" describe-ui --udid "$UDID" >/dev/null && break
            sleep 5
          done

      - name: Screenshots on an iOS 27.2 iPhone
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: bash tool/ci/phone_screenshots.sh "$UDID"

      - name: List the screenshots
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          shots=(build/screenshots/*.png)
          {
            echo "### ${#shots[@]} iOS screenshots"
            for shot in "${shots[@]}"; do echo "- $(basename "$shot" .png)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/screenshots/
          if-no-files-found: error
