# Screenshots of the phone integration tests, for a reviewer to look at. Add
# the `phones` label to a pull request, or run
# `gh workflow run phones.yml --ref <branch>`. A label run uses the pull
# request's merge commit, which has main's copy of this file. A dispatch runs
# the branch's own copy, so a branch cut before this file landed merges main
# first.
#
# Two jobs run the phone integration tests that tool/ci/phone_screenshots.sh
# lists under flutter drive and upload every screenshot they take: android on
# an Android 16 emulator, as the android-screenshots artifact, and ios on an
# iOS 27.2 iPhone simulator, as ios-screenshots. Each fails when a test fails,
# and the screenshots up to that point still upload.
# The ios job holds one of the five macOS jobs the organization can run at
# once, so nothing here runs on a push.
name: Phones

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tests:
        description: The only tests to run, such as phone_recording_away; empty runs them all
        required: false
        default: ''

permissions:
  contents: read

# Adding any label starts this workflow, so the group names the label: a run
# for another label, which skips its jobs, never cancels a phones run.
concurrency:
  group: phones-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'
  PHONE_TESTS: ${{ inputs.tests }}

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'phones'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The emulator needs hardware acceleration, and the runner's /dev/kvm
      # belongs to root until this rule opens it.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Screenshots on an Android 16 emulator
        # The job has 45 minutes; a file that hangs gives up 15 or 12 of them.
        # A file the emulator spoils runs once more within the first 30.
        env:
          PHONE_FIRST_FILE_MINUTES: 15
          PHONE_FILE_MINUTES: 12
          PHONE_RETRY_MINUTES: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tool/ci/phone_screenshots.sh emulator-5554

      - name: List the screenshots
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          shots=(build/screenshots/*.png)
          {
            echo "### ${#shots[@]} Android screenshots"
            for shot in "${shots[@]}"; do echo "- $(basename "$shot" .png)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: build/screenshots/
          if-no-files-found: error

  ios:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'phones'
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      # The runner defaults to Xcode 27.1; 27.2 brings the iOS 27.2 runtime.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pub cache's key: the digest hashFiles('pubspec.lock') gives, taken
      # before the iPhone starts booting. hashFiles has a hard 120 s limit, and
      # it ran past that while the iPhone was booting in the background.
      - name: Hash the lockfile
        id: lock
        shell: bash
        run: |
          hash=$(openssl dgst -sha256 -binary pubspec.lock | shasum -a 256 | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # A fresh iPhone, booting in the background while Flutter installs. The
      # software keyboard has to come up as it does on a phone, so no hardware
      # keyboard is connected.
      - name: Create an iOS 27.2 iPhone
        id: simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          udid=$(xcrun simctl create phones "iPhone 17" com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl boot "$udid" >/dev/null 2>&1 &
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: false

      # flutter-action keys its own pub cache on hashFiles('**/pubspec.lock'),
      # a walk of the whole checkout. This keeps its path and key prefix and
      # adds the digest from Hash the lockfile.
      - uses: actions/cache@v5
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ steps.lock.outputs.hash }}

      - run: flutter pub get --enforce-lockfile

      # flutter_gemma's build hook fetches its native libraries from GitHub
      # once, with no retry; this fetches them first, with retries (KAP-320).
      - run: bash tool/ci/gemma_natives.sh ios_sim_arm64

      # Waits out the boot, or boots the iPhone if that failed, then turns
      # Slide to Type off, which only a booted iPhone accepts, so its
      # introduction doesn't cover the first keyboard.
      - name: Wait for the iPhone
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.ContinuousPath KeyboardContinuousPathEnabled -bool false

      # AXe presses the iPhone's Lock and Home buttons for
      # phone_recording_away: from Xcode 27 a simulator takes button presses
      # only through its own HID service, which simctl has no command for. It
      # also reads the iPhone's screen, Dynamic Island included, which
      # simctl's screenshot leaves out. A first read of the iPhone's
      # accessibility loads the Xcode frameworks its touches need, which on a
      # cold runner take longer than a touch allows.
      - name: Install AXe
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/axe.tar.gz" https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz
          echo "8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa  $RUNNER_TEMP/axe.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/axe"
          tar -xzf "$RUNNER_TEMP/axe.tar.gz" -C "$RUNNER_TEMP/axe"
          echo "$RUNNER_TEMP/axe" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version
          for try in 1 2 3; do
            "$RUNNER_TEMP/axe/axe" describe-ui --udid "$UDID" >/dev/null && break
            sleep 5
          done

      - name: Screenshots on an iOS 27.2 iPhone
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: bash tool/ci/phone_screenshots.sh "$UDID"

      - name: List the screenshots
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          shots=(build/screenshots/*.png)
          {
            echo "### ${#shots[@]} iOS screenshots"
            for shot in "${shots[@]}"; do echo "- $(basename "$shot" .png)"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/screenshots/
          if-no-files-found: error
