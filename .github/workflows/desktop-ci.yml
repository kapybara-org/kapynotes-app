# Desktop builds on every pull request, and on pushes to main and release/**
# — validation, not distribution.
#
# Windows is here because it cannot be built anywhere else: `flutter build
# windows` needs a Windows host with Visual Studio's C++ workload, and macOS
# does not offer the subcommand at all. macOS is here so a break is caught
# before a release tag rather than during one.
#
# Neither artifact is signed. The DMG is ad-hoc signed and Gatekeeper will
# refuse it on any other machine; the Windows installer has no Authenticode
# signature. Both are for looking at, not for shipping — releases come from
# desktop-release.yml, on a tag.
#
# Tags do not run this workflow. A `branches` filter makes a push event ignore
# tags entirely.
# Pushing a tag would otherwise build an unsigned DMG and installer here while
# desktop-release.yml built signed ones from the same commit.
#
# A branch with a pull request is built once, by the pull_request event. A push
# trigger on every branch started a second macOS job for the same commit, and
# the macOS runner queue is the slow part of landing a pull request. main and
# release/** still build on push, since no pull request covers a direct push or
# the commit a merge creates.
#
# Linux builds here too, on x86_64 and aarch64, and the x86_64 packages are
# then started on clean distros. Neither Linux job is a required check yet.
#
# Pull requests from forks run with no secrets — GitHub withholds them — so
# untrusted code cannot reach the signing keys this repository holds for
# desktop-release.yml.
name: Desktop CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `jni` arrives transitively and compiles as an FFI plugin on Windows,
      # where its CMake looks for a JVM. The runner image ships one, but pin it
      # so a change to the image default cannot move the build out from under
      # us. 17 matches the JDK the Android build already requires.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Platform-independent, so it need not run on both platforms. The test
      # suite is deliberately absent: the goldens under test/goldens/ render
      # with macOS system fonts by design, so they cannot pass on Windows.
      - run: flutter analyze

      # The one test that needs Windows itself: the memory probe calls kernel32,
      # and only a Windows host shows that it reads a real number.
      - run: flutter test test/core/device_memory_windows_test.dart

      # The same flags release.sh passes on every other platform: an
      # obfuscated snapshot with its symbols split out is about a sixth
      # smaller. See the header of packaging/release.sh.
      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols/windows

      # Flutter's native host uses the Visual C++ runtime. Put the matching
      # app-local DLLs beside it so the installer also works on a clean PC,
      # without a prerequisite download or an administrator prompt.
      - name: Stage app-local Visual C++ runtime
        run: .\packaging\windows\stage_vc_runtime.ps1

      - name: Read version from pubspec.yaml
        id: version
        run: |
          if ((Get-Content pubspec.yaml -Raw) -match '(?m)^version:\s*([\d.]+)\+') {
            "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw 'Could not read version from pubspec.yaml'
          }

      # Inno Setup ships on the windows-latest image, so this needs no network.
      - name: Build installer
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found on this runner" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\kapynotes.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: build/release/KapyNotes-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # `mac-unsigned` builds the app ad-hoc signed and wraps it in the real
      # branded disk image, using the committed packaging/dmg/DS_Store rather
      # than scripting Finder, which no runner can do. FLUTTER overrides the
      # script's default SDK path.
      - name: Build unsigned DMG
        env:
          FLUTTER: flutter
        run: packaging/release.sh mac-unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-unsigned
          path: build/release/KapyNotes-*-unsigned.dmg
          if-no-files-found: error

  # The tar.gz, .deb and AppImage, built natively on each arch rather than
  # cross-compiled: GitHub's arm64 runners are free for public repositories,
  # and a native build runs the same packaging/release.sh a developer does.
  # ubuntu-22.04 because it is the oldest LTS that Flutter 3.47 and the
  # plugins accept, and its glibc (2.35) is the floor every package inherits:
  # build on a newer one and the app stops starting on 22.04 and Debian 12.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Flutter's own Linux toolchain (clang, cmake, ninja, GTK 3), the
      # libraries the plugins link (the tray's ayatana-appindicator3, secure
      # storage's libsecret), libpulse for the ffmpeg that voice notes use,
      # and the packaging and validation tools.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libsecret-1-dev \
            libpulse-dev make xz-utils curl \
            patchelf dpkg-dev file desktop-file-utils appstream lintian

      # `jni` arrives transitively and its CMake looks for a JVM even though
      # the library it builds is Android-only and never ships; 17 matches the
      # Windows job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # flutter-action installs from Flutter's release archives, which exist
      # for x64 Linux only. On arm64 the SDK is a clone of the release tag,
      # which downloads its own arm64 Dart SDK and engine on first run.
      - if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - if: matrix.arch == 'aarch64'
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-arm64

      - name: Install Flutter from its release tag
        if: matrix.arch == 'aarch64'
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --disable-analytics
          "$HOME/flutter/bin/flutter" precache --linux

      - run: flutter --version

      - run: flutter pub get

      # The LGPL ffmpeg that every package ships in libexec/. It changes only
      # with its script, so a cache keyed on the script's hash skips the
      # build on almost every run.
      - uses: actions/cache@v4
        with:
          path: build/linux/ffmpeg/${{ matrix.arch }}
          key: linux-ffmpeg-${{ matrix.runner }}-${{ hashFiles('packaging/linux/build_ffmpeg.sh') }}

      # Builds the obfuscated release bundle with its symbols split out (as on
      # every other platform), then ffmpeg if the cache missed, then the three
      # packages. FLUTTER overrides the script's default SDK path.
      - name: Build Linux packages
        env:
          FLUTTER: flutter
        run: packaging/release.sh linux

      - name: Validate packages
        run: |
          set -x
          version="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)"
          case "${{ matrix.arch }}" in x86_64) debarch=amd64 ;; aarch64) debarch=arm64 ;; esac
          deb="build/release/KapyNotes-$version-$debarch.deb"
          appimage="build/release/KapyNotes-$version-${{ matrix.arch }}.AppImage"
          tarball="build/release/KapyNotes-$version-linux-${{ matrix.arch }}.tar.gz"
          ls -l "$deb" "$appimage" "$tarball"
          desktop-file-validate linux/runner/resources/com.kapybara.kapynotes.desktop
          appstreamcli validate --no-net --pedantic linux/runner/resources/com.kapybara.kapynotes.metainfo.xml
          dpkg-deb -I "$deb"
          # dlopened rather than linked, so package.sh names them itself.
          for lib in libgl1 libegl1 libgles2; do
            dpkg-deb -f "$deb" Depends | tr ',' '\n' | awk '{print $1}' | grep -qx "$lib" \
              || { echo "::error::$lib missing from the Depends of $deb"; exit 1; }
          done
          dpkg-deb -c "$deb" > deb-contents.txt
          for path in ./usr/bin/kapynotes ./usr/lib/kapynotes/kapynotes ./usr/lib/kapynotes/lib/libapp.so \
            ./usr/lib/kapynotes/libexec/ffmpeg \
            ./usr/share/applications/com.kapybara.kapynotes.desktop \
            ./usr/share/metainfo/com.kapybara.kapynotes.metainfo.xml \
            ./usr/share/icons/hicolor/256x256/apps/com.kapybara.kapynotes.png \
            ./usr/share/doc/kapynotes/copyright; do
            grep -q " $path" deb-contents.txt || { echo "::error::$path missing from $deb"; exit 1; }
          done
          ! grep -q 'libdartjni.so' deb-contents.txt
          tar -tzf "$tarball" | grep -qx 'kapynotes/kapynotes'
          tar -tzf "$tarball" | grep -qx 'kapynotes/libexec/ffmpeg'
          # Lintian's verdict is shown but does not fail the build: a few of
          # its tags (a bundled Flutter engine, a private RUNPATH) are the
          # nature of a Flutter app rather than something to fix.
          lintian --no-tag-display-limit "$deb" || true

      # Voice notes on Linux are ffmpeg talking to PulseAudio, and the ffmpeg
      # is the minimal one the packages ship, so this records, decodes and
      # plays back through that very build against a headless sound server: a
      # speaker nobody hears and a microphone that hears a tone. The tone
      # comes from the distro's ffmpeg, which has the lavfi input the shipped
      # one leaves out. The tests skip themselves where nothing can capture;
      # here that would be a failure, so they run regardless.
      - name: Record, decode and play voice notes through the shipped ffmpeg
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils ffmpeg
          bash test/audio/headless_pulse.sh
          PATH="$PWD/build/linux/ffmpeg/${{ matrix.arch }}:$PATH" flutter test --run-skipped test/audio/linux_voice_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-unsigned
          path: |
            build/release/KapyNotes-*.tar.gz
            build/release/KapyNotes-*.deb
            build/release/KapyNotes-*.AppImage
          if-no-files-found: error

  # Starts the x86_64 packages on distros that have never seen a build
  # toolchain: each container gets only a desktop baseline (GTK 3, libpulse,
  # Mesa, a font) and the test's own Xvfb and D-Bus, never the libraries the
  # portable packages bundle, so a library the bundle forgot fails here rather
  # than on a user's machine. The .deb goes in through apt, which proves its
  # Depends. packaging/linux/smoke_test.sh holds the checks and runs the same
  # locally. The host entry mounts the AppImage through FUSE for real on a
  # 24.04 machine without libfuse2, which is what the static runtime is for.
  linux-smoke:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-12
            image: debian:12
          - name: fedora
            image: fedora:latest
          - name: appimage-fuse
            image: ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-unsigned
          path: dist

      - name: Start the packages in a clean ${{ matrix.image }}
        if: matrix.image != ''
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" bash -c \
            'packaging/linux/smoke_test.sh baseline && packaging/linux/smoke_test.sh all dist smoke-out'

      - name: Mount the AppImage through FUSE
        if: matrix.image == ''
        run: |
          # The runner image has no GL libraries at all, so it gets the
          # containers' desktop baseline first, then FUSE 3 alone.
          sudo packaging/linux/smoke_test.sh baseline
          sudo apt-get install -y --no-install-recommends fuse3
          if dpkg -s libfuse2t64 >/dev/null 2>&1 || dpkg -s libfuse2 >/dev/null 2>&1; then
            sudo apt-get remove -y libfuse2t64 libfuse2 || true
          fi
          ! ldconfig -p | grep -q 'libfuse.so.2'
          SMOKE_FUSE=1 packaging/linux/smoke_test.sh appimage dist/KapyNotes-*.AppImage smoke-out

      # The containers have no ImageMagick on purpose; the runner does.
      - name: Convert screenshots
        if: always()
        run: |
          command -v convert >/dev/null || { sudo apt-get update && sudo apt-get install -y imagemagick; }
          for xwd in smoke-out/*.xwd; do
            [ -e "$xwd" ] && convert "xwd:$xwd" "${xwd%.xwd}.png" && rm "$xwd"
          done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-${{ matrix.name }}
          path: smoke-out
          if-no-files-found: warn
