name: kapy_notes
description: "Notes where every line is a live calculator."
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Local persistence: notes and preferences are plain JSON on disk.
  path_provider: ^2.1.5
  # Exchange-rate refresh. Everything else works with the network unplugged.
  http: ^1.2.2
  # Bundled IANA rules for user-selected note timestamps and DST handling.
  timezone: ^0.11.1
  # Desktop window chrome (macOS traffic-light inset, min size, title bar).
  window_manager: ^0.5.2
  # Editable system-wide summon shortcut on macOS and Windows.
  hotkey_manager: ^0.2.3
  # The tray icon that a window closing to the background needs, so there is
  # always something to click on and always a way to quit. Opt-in: nothing
  # appears in the tray until the setting is turned on.
  tray_manager: ^0.5.3
  # Material moved out of the SDK in Flutter 3.44; the in-SDK library is
  # deprecated in the Nov 2026 release. cupertino_ui arrives transitively and
  # backs the .adaptive widgets, so it needs no direct entry here.
  material_ui: ^1.1.0
  # Opens note links and the active exchange-rate source attribution in the
  # platform browser.
  url_launcher: ^6.3.2
  # Sparkle (macOS) and WinSparkle (Windows) behind one API. Only the install
  # half is used: the quiet check is our own, so no Sparkle UI appears until
  # the user asks for it. See UpdateChecker.
  auto_updater: ^1.0.0
  # Lets the update check compare the appcast against the running build. The
  # version is native (Info.plist / the .rc), not a Dart constant.
  package_info_plus: ^10.2.1

  # End-to-end encryption for sync. The maintained fork: the original
  # `cryptography` package last shipped in Nov 2025, this one tracks current
  # Dart SDKs. Argon2id to stretch the passphrase, XChaCha20-Poly1305 to seal
  # note payloads. Nothing here runs on the launch path — notes stay plaintext
  # on local disk, so opening the app costs no crypto at all.
  cryptography_plus: ^3.0.0
  # The master key, parked in Keychain / Keystore / libsecret / DPAPI after the
  # first unlock. This is what keeps Argon2id a once-per-device cost instead of
  # a once-per-launch one.
  flutter_secure_storage: ^11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Platform app icons are native. These are the only brand bitmaps Flutter
    # carries, so keep unused source variants off the mobile startup bundle.
    - assets/branding/kapy_notes_logo.png
    # The tray icon, read by tray_manager from the bundle rather than painted:
    # an .ico for the Windows notification area, a template PNG that macOS
    # tints for the menu bar. Desktop-only, and small enough not to matter.
    - assets/branding/kapynotes_tray_windows.ico
    - assets/branding/kapynotes_tray_macos.png
    - assets/fonts/ShantellSans-OFL.txt
  fonts:
    - family: Shantell Sans
      fonts:
        - asset: assets/fonts/ShantellSans-Variable.ttf
        - asset: assets/fonts/ShantellSans-Italic-Variable.ttf
          style: italic
    - family: OdinRounded
      fonts:
        - asset: assets/fonts/OdinRounded-Bold.otf
          weight: 700
