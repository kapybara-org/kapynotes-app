name: kapy_notes
description: "Notes where every line is a live calculator."
publish_to: 'none'
version: 1.19.0+20

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Local persistence: notes and preferences are plain JSON on disk.
  path_provider: ^2.1.5
  # Exchange-rate refresh. Everything else works with the network unplugged.
  http: ^1.2.2
  # Bundled IANA rules for user-selected note timestamps and DST handling.
  timezone: ^0.11.1
  # Desktop window chrome (macOS traffic-light inset, min size, title bar).
  window_manager: ^0.5.2
  # Editable system-wide summon shortcut on macOS and Windows.
  hotkey_manager: ^0.2.3
  # The tray icon that a window closing to the background needs, so there is
  # always something to click on and always a way to quit. Opt-in: nothing
  # appears in the tray until the setting is turned on.
  tray_manager: ^0.5.3
  # Material moved out of the SDK in Flutter 3.44; the in-SDK library is
  # deprecated in the Nov 2026 release. cupertino_ui arrives transitively and
  # backs the .adaptive widgets, so it needs no direct entry here.
  material_ui: ^1.1.0
  # Opens note links and the active exchange-rate source attribution in the
  # platform browser.
  url_launcher: ^6.3.2
  # Sparkle (macOS) and WinSparkle (Windows) behind one API. Only the install
  # half is used: the quiet check is our own, so no Sparkle UI appears until
  # the user asks for it. See UpdateChecker.
  auto_updater: ^1.0.0
  # Lets the update check compare the appcast against the running build. The
  # version is native (Info.plist / the .rc), not a Dart constant.
  package_info_plus: ^10.2.1

  # End-to-end encryption for sync. The maintained fork: the original
  # `cryptography` package last shipped in Nov 2025, this one tracks current
  # Dart SDKs. Argon2id to stretch the passphrase, XChaCha20-Poly1305 to seal
  # note payloads. Nothing here runs on the launch path — notes stay plaintext
  # on local disk, so opening the app costs no crypto at all.
  cryptography_plus: ^3.0.0
  # Zip container for export / import. Pure Dart, so the same code path runs
  # on all four platforms and inside a test with no plugin registrar.
  archive: ^4.0.7
  # SHA-256 over each exported markdown file, so import can tell a file the
  # user hand-edited from one it wrote itself. Already present transitively;
  # named here because this is a direct use.
  crypto: ^3.0.7
  # The save and open dialogs export and import need. Flutter-team federated
  # plugin; `getSaveLocation` is desktop-only, and the mobile path writes into
  # the app's own documents directory instead.
  file_selector: ^1.0.3

  # A deliberately small camera surface for note capture on phones: live
  # preview, rear/front switching, flash and still-image capture. Pinned to
  # the newest release whose public package keeps this app's Dart 3.10 floor.
  camera: 0.12.0+2
  # The platform photo library behind the Photos button in that camera. Its
  # lost-data API also lets Android finish a selection after recreating the
  # activity under memory pressure.
  image_picker: ^1.2.3

  # Decode-and-re-encode for image attachments. Pure Dart, so the same
  # compression runs on all five platforms and inside a test with no plugin
  # registrar — and inside an isolate, which is what keeps a 12MP paste from
  # dropping frames. It has no WebP *encoder*, which is why the lossless path
  # is PNG; see lib/images/image_codec.dart.
  image: ^4.3.0

  # The master key, parked in Keychain / Keystore / libsecret / DPAPI after the
  # first unlock. This is what keeps Argon2id a once-per-device cost instead of
  # a once-per-launch one.
  flutter_secure_storage: ^11.0.0
  # Dropping image files onto the note. Desktop and web only by design; on a
  # phone the picker is the whole story, and the drop target simply is not
  # built there. The macOS sandbox already grants what this needs — a drop is
  # a user-selected file, covered by the same entitlement as the open panel.
  desktop_drop: ^0.8.4
  # Recording a voice note. AAC-LC into an MPEG-4 container on all four
  # platforms, which is the one format every one of them can both write and
  # play without a codec of our own. Pauses itself on a phone call or a focus
  # loss and reports it, so an interrupted recording is recoverable rather
  # than truncated. Fully Swift Package Manager on iOS and macOS, so it forces
  # no Podfile into `ios/`.
  record: ^7.1.1
  # Playing one back. Chosen over audioplayers for its position stream, which
  # is what lets the waveform follow along at 4 Hz without polling.
  just_audio: ^0.10.6
  # just_audio has no Windows implementation of its own; this is the WinRT
  # MediaPlayer one, and is a no-op everywhere else.
  just_audio_windows: ^0.2.3

  # Running a small language model on the device, so a voice note can be
  # summarised with no account, no minutes and nothing leaving the machine.
  # Core plus one engine: the `.litertlm` reader, which is the only format
  # that covers all five platforms — LiteRT-LM through `dart:ffi` on desktop
  # and the same bundle on the phones. The MediaPipe engine is deliberately
  # not added; it would only duplicate this for `.task` files we do not ship.
  flutter_gemma: ^1.7.3
  flutter_gemma_litertlm: ^1.6.3

  # Running a speech recogniser on the device, so a recording can become words
  # with no account, no minutes and nothing leaving the machine. Prebuilt
  # native libraries for every platform this app ships on — no CMake, no NDK
  # and no Rust on the build machines — which is why this and not
  # whisper_ggml, and it reads files rather than only the live microphone,
  # which is why not speech_to_text.
  #
  # Apple platforms on macOS or iOS 26 never load it: `Transcription.swift`
  # answers there, and it is better and free. This is for Windows, Android and
  # the Apple devices below that line.
  sherpa_onnx: ^1.13.7

  # Reading an image off the system clipboard, which Flutter's own
  # `Clipboard` cannot do — it handles text and nothing else. Chosen over
  # super_clipboard, which is more capable but needs a Rust toolchain on every
  # build machine; that is a change to the release pipeline this does not
  # justify. Covers all five platforms with plain native code.
  pasteboard: ^0.5.0
# The Apple halves of sherpa_onnx carry a 26 MB (iOS) or 56 MB (macOS) native
# library the app never uses there: Apple's own on-device recogniser does the
# job. These stand-ins have no native code. See packages/apple_stubs/README.md.
dependency_overrides:
  sherpa_onnx_ios:
    path: packages/apple_stubs/sherpa_onnx_ios
  sherpa_onnx_macos:
    path: packages/apple_stubs/sherpa_onnx_macos

dev_dependencies:
  # Virtual timers, so the thirty-minute recording cap can be tested in a
  # microsecond. Already present transitively through flutter_test; named here
  # because this is a direct use.
  fake_async: ^1.3.1

  flutter_test:
    sdk: flutter
  # Drives the real app on a real device or simulator, with the real plugins
  # behind it. `flutter test` runs against fakes by design; this is the only
  # way to find out whether the microphone actually works on a platform.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Platform app icons are native. Keep only the small brand bitmaps used by
    # the running app here so unused source variants stay out of the bundle.
    - assets/branding/kapy_notes_logo.png
    - assets/mascot/kapy_cursor_peek.webp
    - assets/mascot/kapy_standing.webp
    - assets/mascot/kapy_sleeping.webp
    - assets/mascot/kapy_header_emerge_30fps.webp
    - assets/mascot/kapy_header_think_30fps.webp
    - assets/mascot/kapy_header_sleep_30fps.webp
    - assets/mascot/kapy_header_sleep_loop_30fps.webp
    # The tray icon, read by tray_manager from the bundle rather than painted:
    # an .ico for the Windows notification area, a template PNG that macOS
    # tints for the menu bar. Desktop-only, and small enough not to matter.
    - assets/branding/kapynotes_tray_windows.ico
    - assets/branding/kapynotes_tray_macos.png
    - assets/fonts/ShantellSans-OFL.txt
  fonts:
    - family: Shantell Sans
      fonts:
        - asset: assets/fonts/ShantellSans-Variable.ttf
        - asset: assets/fonts/ShantellSans-Italic-Variable.ttf
          style: italic
    - family: OdinRounded
      fonts:
        - asset: assets/fonts/OdinRounded-Bold.otf
          weight: 700
